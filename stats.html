<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep — statistics</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 20px; }
  .tile { background: rgba(122,162,247,.1); border-radius: 8px; padding: 12px 14px; }
  .tile strong { display: block; font-size: 22px; }
  .tile span { font-size: 12px; opacity: .7; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 20px; }
  table.t th, table.t td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid, #2a2c3a); }
  table.t th { font-size: 11.5px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  h3 { margin: 18px 0 6px; }
  .bossicon { border-radius: 6px; vertical-align: middle; margin-right: 8px; border: 1px solid var(--grid, #2a2c3a); }
</style>
</head>
<body>
<main>
  <div class="card" id="card"><div class="loading">loading…</div></div>
</main>
<script src="assets/shared.js"></script>
<script>
"use strict";
renderNav("stats.html");
const fmtDur = (ms) => {
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const parts = [];
  if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
  if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
  if (!h && s) parts.push(s + (s === 1 ? " second" : " seconds"));
  return parts.join(" ") || "0 seconds";
};

async function loadBiosMap() {
  try {
    const r = await fetch("data/bios.json");
    return r.ok ? (await r.json()).bios : null;
  } catch { return null; }
}

Promise.all([loadRaids(), loadLoot(), loadBiosMap()]).then(([raids, loot, bios]) => {
  const zoneName = new Map(raids.zones.map((z) => [z.zoneId, z.zoneName]));
  const players = new Map();
  let wipes = 0;
  const bossAgg = new Map(); // zoneId/key -> {name, zoneId, key, kills, wipes}
  for (const s of raids.sessions) {
    for (const n of s.roster) players.set(n, (players.get(n) ?? 0) + 1);
    for (const b of s.bosses) {
      wipes += b.wipes ?? 0;
      const k = `${s.zoneId}/${b.key}`;
      if (!bossAgg.has(k)) bossAgg.set(k, { name: b.name, zoneId: s.zoneId, key: b.key, kills: 0, wipes: 0 });
      const e = bossAgg.get(k);
      if (b.status === "killed") e.kills += 1;
      e.wipes += b.wipes ?? 0;
    }
  }
  const first = raids.sessions[0], last = raids.sessions[raids.sessions.length - 1];
  const mains = loot.awards.filter((a) => a.isMainCharacterAward);

  const tiles = [
    [raids.sessions.length, "raid nights"],
    [`${first.date} – ${last.date}`, "first to last log"],
    [players.size, "different raiders"],
    [raids.totals.kills, "boss kills"],
    [wipes, "wipes"],
    [raids.fullClears.length, "full clears"],
    [loot.awards.length, "loot awards recorded"],
    [mains.length, "to main characters"],
  ].map(([v, l]) => `<div class="tile"><strong>${v}</strong><span>${l}</span></div>`).join("");

  const END_BOSSES = ["onyxia", "ragnaros", "nefarian", "hakkar", "ossirian", "cthun", "kelthuzad"];
  const BOSS_ICONS = {
    onyxia: "achievement_boss_onyxia",
    ragnaros: "achievement_boss_ragnaros",
    nefarian: "achievement_boss_nefarion",
    hakkar: "achievement_boss_hakkar",
    ossirian: "achievement_boss_kurinaxx", // AQ20 set; swapped if a better one exists
    cthun: "achievement_boss_cthun",
    kelthuzad: "achievement_dungeon_naxxramas_kelthuzad",
  };
  const endRows = [...bossAgg.values()]
    .filter((b) => END_BOSSES.includes(b.key.replace(/-/g, "")) || END_BOSSES.includes(b.key))
    .sort((a, b) => a.zoneId - b.zoneId)
    .map((b) => {
      const f = raids.firstKills.find((x) => x.zoneId === b.zoneId && x.bossKey === b.key);
      const fasts = (raids.fastestKillsByGuild ?? []).filter((x) => x.bossKey === b.key);
      const icon = BOSS_ICONS[b.key.replace(/-/g, "")];
      const img = icon
        ? `<img class="bossicon" width="36" height="36" loading="lazy" alt="" onerror="this.style.display='none'" src="https://wow.zamimg.com/images/wow/icons/large/${icon}.jpg"> `
        : "";
      const fastCell = fasts.map((x) =>
        `<div><span style="color:${LANE[x.identity]?.color ?? "inherit"}">${LANE[x.identity]?.label ?? x.identity}</span> ` +
        `${fmtDur(x.durationMs)} (<a href="raid.html#${x.sessionId}">${x.date}</a>)</div>`).join("");
      return `<tr><td>${img}<a href="boss.html#${b.zoneId}/${b.key}">${esc(b.name)}</a></td>` +
        `<td>${b.kills}</td><td>${b.wipes || ""}</td>` +
        `<td>${f ? `<a href="raid.html#${f.sessionId}">${f.date}</a>` : ""}</td>` +
        `<td>${fastCell}</td></tr>`;
    }).join("");

  // One row per raid x guild, so Sleep's fastest MC sits beside Dusk's.
  const laneOrder = LANES.map((l) => l.key);
  const clearAgg = new Map();
  for (const c of raids.fullClears) {
    const k = `${c.zoneId}|${c.identity}`;
    if (!clearAgg.has(k)) clearAgg.set(k, { zoneId: c.zoneId, identity: c.identity, n: 0, fastest: null });
    const e = clearAgg.get(k);
    e.n += 1;
    if (!e.fastest || c.clearSpanMs < e.fastest.clearSpanMs) e.fastest = c;
  }
  const clearRows = [...clearAgg.values()]
    .sort((a, b) => a.zoneId - b.zoneId || laneOrder.indexOf(a.identity) - laneOrder.indexOf(b.identity))
    .map((e) =>
      `<tr><td>${esc(zoneName.get(e.zoneId) ?? e.zoneId)}</td>` +
      `<td><span style="color:${LANE[e.identity]?.color ?? "inherit"}">${LANE[e.identity]?.label ?? e.identity}</span></td>` +
      `<td>${e.n}</td>` +
      `<td>${fmtDur(e.fastest.clearSpanMs)} (<a href="raid.html#${e.fastest.sessionId}">${e.fastest.date}</a>)</td></tr>`).join("");

  // Fold alt nights into their main (alts declared in bios.json).
  const combined = new Map(); // main display name -> {total, self, alts: [[altName, n]]}
  for (const [n, c] of players) {
    const main = bios?.[n.toLowerCase()]?.main;
    const key = main ?? n;
    if (!combined.has(key)) combined.set(key, { total: 0, self: 0, alts: [] });
    const e = combined.get(key);
    e.total += c;
    if (main) e.alts.push([n, c]);
    else e.self = c;
  }
  const topRows = [...combined.entries()].sort((a, b) => b[1].total - a[1].total).slice(0, 15).map(([n, e], i) => {
    const altStr = e.alts.length
      ? ` <span class="mutetext">(${e.alts.map(([a, c]) => `<a href="players.html#${encodeURIComponent(a)}">${esc(a)}</a> ${c}`).join(", ")})</span>`
      : "";
    return `<tr><td>${i + 1}</td><td><a href="players.html#${encodeURIComponent(n)}">${esc(n)}</a>${altStr}</td><td>${e.total}</td></tr>`;
  }).join("");

  document.getElementById("card").innerHTML =
    `<h2>Statistics</h2>` +
    `<div class="tiles">${tiles}</div>` +
    `<h3>End bosses</h3>` +
    `<table class="t"><thead><tr><th>boss</th><th>kills</th><th>wipes</th><th>first kill</th><th>fastest kill</th></tr></thead><tbody>${endRows}</tbody></table>` +
    `<h3>Full clears</h3>` +
    `<table class="t"><thead><tr><th>raid</th><th>guild</th><th>full clears</th><th>fastest clear</th></tr></thead><tbody>${clearRows}</tbody></table>` +
    `<h3>Most raid nights</h3>` +
    `<table class="t"><thead><tr><th></th><th>player</th><th>nights</th></tr></thead><tbody>${topRows}</tbody></table>`;
});
</script>
</body>
</html>
