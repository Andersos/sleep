<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep — boss kills</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  .bestiary h2, .bestiary h3, .bosscard h4, .bosshead h2 {
    font-family: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
    letter-spacing: .01em;
  }
  .zonehead { display: flex; align-items: baseline; gap: 14px; margin: 30px 0 14px; }
  .zonehead h3 { margin: 0; font-size: 21px; font-weight: 700; color: #e0af68; }
  .zonehead .rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(224,175,104,.55), rgba(224,175,104,0)); }
  .zonehead .tally { font-size: 12px; opacity: .65; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  .bossgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .bosscard {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--grid, #2a2c3a); border-radius: 10px;
    text-decoration: none; color: inherit;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    animation: rise .45s ease backwards;
  }
  .bosscard:hover {
    transform: translateY(-3px);
    border-color: rgba(224,175,104,.6);
    box-shadow: 0 8px 26px rgba(0,0,0,.45), 0 0 0 1px rgba(224,175,104,.25);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .medallion {
    width: 54px; height: 54px; border-radius: 50%; flex: none;
    border: 2px solid rgba(224,175,104,.55); box-shadow: 0 0 0 3px rgba(0,0,0,.35);
    object-fit: cover; background: #14141c;
  }
  .medallion.lg { width: 86px; height: 86px; border-width: 3px; }
  .bosscard h4 { margin: 0 0 3px; font-size: 15.5px; font-weight: 700; line-height: 1.2; color: var(--ink, #e6e6ef); }
  .bosscard:hover h4 { color: #e0af68; }
  .bosscard, .bosscard:hover { text-decoration: none; }
  .bosscard .tally { font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; opacity: .85; }
  .kill { color: #9ece6a; } .wipe { color: #f7768e; }
  .bosshead { display: flex; align-items: center; gap: 18px; margin: 6px 0 4px; }
  .bosshead h2 { margin: 0; font-size: 30px; font-weight: 700; }
  .bosshead .zone { display: block; font-size: 13px; opacity: .6; margin-top: 2px; font-family: inherit; }
  .statchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .statchips span { background: rgba(224,175,104,.09); border: 1px solid rgba(224,175,104,.28); border-radius: 8px; padding: 7px 13px; font-size: 13px; }
  .statchips strong { display: block; font-size: 16px; font-family: "Fraunces", Georgia, serif; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.t th, table.t td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid, #2a2c3a); }
  table.t th { font-size: 11.5px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .backlink { font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<main>
  <div class="card bestiary" id="card"><div class="loading">loading…</div></div>
</main>
<script src="assets/shared.js"></script>
<script>
"use strict";
renderNav("boss.html");
const card = document.getElementById("card");
let RAIDS = null;
let zoneName = new Map();

const fmtDur = (ms) => {
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const parts = [];
  if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
  if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
  if (!h && s) parts.push(s + (s === 1 ? " second" : " seconds"));
  return parts.join(" ") || "0 seconds";
};

// Second-tier boss art for bosses without achievement portraits, plus a
// raid-crest fallback so every boss has an image.
const BOSS_ART = {
  "lucifron": "spell_shadow_curseofachimonde",
  "magmadar": "spell_fire_lavaspawn",
  "gehennas": "spell_shadow_rainoffire",
  "garr": "spell_nature_earthquake",
  "shazzrah": "spell_nature_wispsplode",
  "baron-geddon": "spell_fire_selfdestruct",
  "sulfuron": "inv_hammer_unique_sulfuras",
  "golemagg": "spell_fire_moltenblood",
  "majordomo": "spell_fire_fireball02",
  "razorgore": "inv_misc_head_dragon_01",
  "vaelastrasz": "inv_misc_head_dragon_red",
  "broodlord": "inv_misc_head_dragon_black",
  "firemaw": "spell_fire_flameshock",
  "venoxis": "ability_creature_poison_05",
  "marli": "spell_nature_web",
  "thekal": "ability_druid_catform",
  "kurinnaxx": "achievement_boss_kurinaxx",
  "skeram": "spell_shadow_psychicscream",
  "sartura": "ability_warrior_whirlwind",
  "viscidus": "spell_nature_acid_01",
  "twin-emperors": "spell_shadow_mindtwisting",
};
const ZONE_CREST = {
  1000: "spell_fire_volcano",
  1001: "inv_misc_head_dragon_01",
  1002: "inv_misc_head_dragon_black",
  1003: "inv_misc_idol_02",
  1004: "spell_nature_insectswarm",
  1005: "spell_shadow_carrionswarm",
  1006: "spell_shadow_raisedead",
};
function bossArt(zoneId, key, size, lg) {
  const primary = BOSS_ICONS[key] ?? BOSS_ICONS[key.replace(/-/g, "")] ?? BOSS_ART[key];
  const crest = ZONE_CREST[zoneId] ?? "inv_misc_questionmark";
  const src = `https://wow.zamimg.com/images/wow/icons/large/${primary ?? crest}.jpg`;
  const fb = `https://wow.zamimg.com/images/wow/icons/large/${crest}.jpg`;
  return `<img class="medallion${lg ? " lg" : ""}" width="${size}" height="${size}" loading="lazy" alt="" ` +
    `data-fb="${primary ? fb : ""}" ` +
    `onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.visibility='hidden';}" ` +
    `src="${src}">`;
}

function bossHistory(zoneId, key) {
  const nights = [];
  for (const s of RAIDS.sessions) {
    if (s.zoneId !== zoneId) continue;
    const b = s.bosses.find((x) => x.key === key);
    if (b) nights.push({ s, b });
  }
  return nights;
}

function renderList() {
  const byZone = new Map();
  for (const s of RAIDS.sessions) {
    for (const b of s.bosses) {
      if (!byZone.has(s.zoneId)) byZone.set(s.zoneId, new Map());
      const zone = byZone.get(s.zoneId);
      if (!zone.has(b.key)) zone.set(b.key, { name: b.name, order: b.order, kills: 0, wipes: 0 });
      const e = zone.get(b.key);
      if (b.status === "killed") e.kills += 1;
      e.wipes += b.wipes ?? 0;
    }
  }
  let html = `<h2>Boss kills</h2><p class="sub">Every boss the guild faced, and what it cost.</p>`;
  let idx = 0;
  for (const [zoneId, bosses] of [...byZone].sort((a, b) => a[0] - b[0])) {
    const entries = [...bosses.entries()].sort((a, b) => a[1].order - b[1].order);
    const zk = entries.reduce((n, [, e]) => n + e.kills, 0);
    const zw = entries.reduce((n, [, e]) => n + e.wipes, 0);
    html += `<div class="zonehead"><h3>${esc(zoneName.get(zoneId) ?? zoneId)}</h3><div class="rule"></div>` +
      `<span class="tally">${zk} kills · ${zw} wipes</span></div>` +
      `<div class="bossgrid">` +
      entries.map(([key, e]) => {
        idx += 1;
        return `<a class="bosscard" style="animation-delay:${Math.min(idx * 22, 500)}ms" href="#${zoneId}/${key}">` +
          bossArt(zoneId, key, 54) +
          `<div><h4>${esc(e.name)}</h4>` +
          `<div class="tally"><span class="kill">${e.kills} kills</span>` +
          (e.wipes ? ` · <span class="wipe">${e.wipes} wipes</span>` : "") +
          `</div></div></a>`;
      }).join("") +
      `</div>`;
  }
  card.innerHTML = html;
  document.title = "Sleep — boss kills";
}

function render() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (!hash) { renderList(); return; }
  const [zoneIdRaw, key] = hash.split("/");
  const zoneId = Number(zoneIdRaw);
  const nights = bossHistory(zoneId, key);
  if (!nights.length) {
    card.innerHTML = `<div class="empty">Unknown boss. See the <a href="boss.html">boss list</a>.</div>`;
    return;
  }
  const name = nights[0].b.name;
  const kills = nights.filter((n) => n.b.status === "killed").length;
  const wipes = nights.reduce((n, x) => n + (x.b.wipes ?? 0), 0);
  const perGuild = new Map();
  for (const { s: sess, b } of nights) {
    if (!perGuild.has(sess.identity)) perGuild.set(sess.identity, { kills: 0, wipes: 0 });
    const e = perGuild.get(sess.identity);
    if (b.status === "killed") e.kills += 1;
    e.wipes += b.wipes ?? 0;
  }
  const laneOrder = LANES.map((l) => l.key);
  const guildRows = [...perGuild.entries()]
    .sort((a, b) => laneOrder.indexOf(a[0]) - laneOrder.indexOf(b[0]))
    .map(([id, e]) =>
      `<tr><td><span style="color:${LANE[id]?.color ?? "inherit"}">${LANE[id]?.label ?? id}</span></td>` +
      `<td class="kill">${e.kills}</td><td class="wipe">${e.wipes || ""}</td></tr>`).join("");
  const first = RAIDS.firstKills.find((f) => f.zoneId === zoneId && f.bossKey === key);
  const fasts = (RAIDS.fastestKillsByGuild ?? []).filter((f) => f.bossKey === key);
  const rows = nights.map(({ s, b }) =>
    `<tr><td class="mono"><a href="raid.html#${s.id}">${s.date}</a></td>` +
    `<td><span class="lchip"><span class="dot" style="background:${LANE[s.identity]?.color ?? "#888"}"></span>${LANE[s.identity]?.label ?? s.identity}</span></td>` +
    `<td class="${b.status === "killed" ? "kill" : "wipe"}">${b.status === "killed" ? "killed" : "not killed"}</td>` +
    `<td>${b.pulls ?? ""}</td><td>${b.wipes ?? 0}</td></tr>`).join("");
  card.innerHTML =
    `<p class="backlink"><a href="boss.html">&larr; all bosses</a></p>` +
    `<div class="bosshead">${bossArt(zoneId, key, 86, true)}` +
    `<h2>${esc(name)}<span class="zone">${esc(zoneName.get(zoneId) ?? "")}</span></h2></div>` +
    `<div class="statchips">` +
    `<span><strong>${kills}</strong>kills</span>` +
    `<span><strong>${wipes}</strong>wipes</span>` +
    (first ? `<span><strong><a href="raid.html#${first.sessionId}">${first.date}</a></strong>first kill (${fmtDur(first.durationMs)})</span>` : "") +
    fasts.map((f) =>
      `<span><strong>${fmtDur(f.durationMs)}</strong><span style="color:${LANE[f.identity]?.color ?? "inherit"}">${LANE[f.identity]?.label ?? f.identity}</span> fastest (<a href="raid.html#${f.sessionId}">${f.date}</a>)</span>`).join("") +
    `</div>` +
    (perGuild.size > 1
      ? `<div class="striplabel">Per guild</div>` +
        `<table class="t" style="max-width:420px;margin-bottom:16px"><thead><tr><th>guild</th><th>kills</th><th>wipes</th></tr></thead><tbody>${guildRows}</tbody></table>`
      : "") +
    `<div class="striplabel">Every night this boss was pulled</div>` +
    `<table class="t"><thead><tr><th>date</th><th>guild</th><th>result</th><th>pulls</th><th>wipes</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.title = `Sleep — ${name}`;
}

addEventListener("hashchange", render);
loadRaids().then((raids) => {
  RAIDS = raids;
  for (const z of raids.zones) zoneName.set(z.zoneId, z.zoneName);
  render();
});
</script>
</body>
</html>
