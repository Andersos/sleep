<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep — officers</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .grp { margin: 22px 0 6px; }
  .grp h3 { margin: 0 0 8px; font-size: 17px; color: #e0af68; }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--grid, #2a2c3a); flex-wrap: wrap; }
  .row:last-child { border-bottom: 0; }
  .row .who { min-width: 150px; font-weight: 600; }
  .row .role { font-size: 13.5px; opacity: .9; }
  .row .period { font-size: 12px; opacity: .6; font-family: ui-monospace, Menlo, monospace; margin-left: auto; white-space: nowrap; }
  .clsicon { border-radius: 3px; vertical-align: -3px; margin-right: 5px; }
  .chainrow { display: flex; align-items: baseline; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--grid, #2a2c3a); flex-wrap: wrap; }
  .chainrow:last-child { border-bottom: 0; }
  .chainlabel { min-width: 78px; font-weight: 700; font-size: 13.5px; }
  .chain { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 13.5px; }
  .chain .arrow { opacity: .45; margin: 0 2px; }
  .chain .period { font-size: 11px; opacity: .55; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h2>Officers &amp; leadership</h2>
    <p class="sub">Everyone who ran the guild — guild masters, officers, and the
    class leaders who did the daily work. Click a role to see everyone who held it.</p>
    <div id="groups"><div class="loading">loading…</div></div>
  </div>
</main>
<script src="assets/shared.js"></script>
<script>
"use strict";
renderNav("officers.html");
const CLASS_COLORS = {
  Warrior: "#C79C6E", Paladin: "#F58CBA", Hunter: "#ABD473", Rogue: "#FFF569",
  Priest: "#FFFFFF", Mage: "#69CCF0", Warlock: "#9482C9", Druid: "#FF7D0A",
};
async function grab(path) {
  const r = await fetch(path);
  return r.ok ? r.json() : null;
}
const GUILD_ORDER = ["Sleep", "Ninjas & Dusk", "Sleep & Dusk", "Dusk", "Ascension"];
function roleWeight(role) {
  const r = role.toLowerCase();
  if (r.includes("founder")) return 0;
  if (r.includes("guild master")) return 1;
  if (r.includes("officer")) return 2;
  if (r.includes("class leader")) return 3;
  return 4;
}
// Loose chronological start for period strings like "Feb – Sep 2020",
// "until Mar 2020", "from Sep 2020", "Oct 2019 – Jul 2020", "2020".
function periodStart(period) {
  const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const p = period.toLowerCase();
  if (p.startsWith("until")) return 0;
  const year = (p.match(/(20\d\d)/) ?? [])[1];
  const month = (p.match(/^(?:from )?([a-z]{3})/) ?? [])[1];
  const y = year ? Number(year) : 2020;
  const m = MONTHS[month] ?? 6;
  return y * 12 + m;
}

function successionSection(entries, classes) {
  const chains = new Map(); // lineage label -> [{name, period, start}]
  for (const e of entries) {
    const m = e.role.match(/^(\w+) class leader/i);
    const label = m ? m[1] : (/healing officer/i.test(e.role) ? "Healing" : null);
    if (!label) continue;
    if (!chains.has(label)) chains.set(label, []);
    chains.get(label).push({ name: e.name, period: e.period, start: periodStart(e.period) });
  }
  const rows = [...chains.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([label, list]) => {
      list.sort((a, b) => a.start - b.start);
      const color = CLASS_COLORS[label] ?? "#e0af68";
      const chain = list.map((e) => {
        const name = e.name.charAt(0).toUpperCase() + e.name.slice(1);
        return `<span class="link"><a style="color:${CLASS_COLORS[classes[e.name.toLowerCase()]] ?? "inherit"}" href="players.html#${encodeURIComponent(name)}">${esc(name)}</a> <span class="period">${esc(e.period)}</span></span>`;
      }).join(`<span class="arrow">→</span>`);
      return `<div class="chainrow"><span class="chainlabel" style="color:${color}">${esc(label)}</span><span class="chain">${chain}</span></div>`;
    }).join("");
  return `<div class="grp"><h3>Successions</h3><p class="sub" style="margin:0 0 8px">Who handed the job to whom, class by class.</p>${rows}</div>`;
}

Promise.all([grab("data/bios.json"), grab("data/classes.json")]).then(([b, c]) => {
  const classes = c?.classes ?? {};
  const groups = new Map(GUILD_ORDER.map((g) => [g, []]));
  const seen = new Set();
  for (const [key, entry] of Object.entries(b?.bios ?? {})) {
    if (!entry.roles || seen.has(entry.name.toLowerCase())) continue;
    seen.add(entry.name.toLowerCase());
    for (const r of entry.roles) {
      const g = r.guild ?? "Sleep";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push({ name: entry.name, role: r.role, period: r.period, hasBio: !!entry.html });
    }
  }
  const allEntries = [...groups.values()].flat();
  const succession = successionSection(allEntries, classes);
  const html = succession + [...groups.entries()].filter(([, list]) => list.length).map(([title, list]) => {
    list.sort((a, b) => roleWeight(a.role) - roleWeight(b.role) || a.name.localeCompare(b.name));
    const rows = list.map((e) => {
      const cls = classes[e.name.toLowerCase()];
      const icon = cls ? `<img class="clsicon" width="16" height="16" alt="${cls}" src="https://wow.zamimg.com/images/wow/icons/small/classicon_${cls.toLowerCase()}.jpg">` : "";
      const name = e.name.charAt(0).toUpperCase() + e.name.slice(1);
      return `<div class="row">` +
        `<span class="who">${icon}<a style="color:${CLASS_COLORS[cls] ?? "inherit"}" href="players.html#${encodeURIComponent(name)}">${esc(name)}</a>${e.hasBio ? " 📖" : ""}</span>` +
        `<a class="role" href="players.html#role:${encodeURIComponent(e.role)}">${esc(e.role)}</a>` +
        `<span class="period">${esc(e.period)}</span></div>`;
    }).join("");
    return `<div class="grp"><h3>${title}</h3>${rows}</div>`;
  }).join("");
  document.getElementById("groups").innerHTML = html || `<div class="empty">no roles recorded</div>`;
});
</script>
</body>
</html>
