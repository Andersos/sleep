<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep — milestones</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .feed { position: relative; margin: 10px 0 0 8px; padding-left: 26px; border-left: 2px solid var(--grid, #2a2c3a); }
  .ev { position: relative; margin: 0 0 22px; }
  .ev::before { content: ""; position: absolute; left: -33px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted, #888); }
  .ev.story::before { background: #e0af68; }
  .ev.kill::before { background: #9ece6a; }
  .ev.clear::before { background: #7aa2f7; }
  .ev.phase::before { background: #bb9af7; }
  .ev h3 { margin: 0 0 2px; font-size: 15.5px; }
  .ev .when { font-size: 11.5px; opacity: .6; font-family: ui-monospace, Menlo, monospace; }
  .ev p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.5; opacity: .9; max-width: 640px; }
  .ev .long p { margin-top: 8px; opacity: .82; }
  .ev .vids { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ev .vids img { border-radius: 6px; border: 1px solid var(--grid, #2a2c3a); display: block; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters button { border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--grid, #2a2c3a); background: transparent; color: inherit; }
  .filters button[aria-pressed="true"] { border-color: currentColor; }
  .f-story { color: #e0af68; } .f-kill { color: #9ece6a; } .f-clear { color: #7aa2f7; } .f-phase { color: #bb9af7; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h2>Milestones</h2>
    <p class="sub">Everything that happened, in order: story moments, first boss kills, first full clears, and the phase openings that framed them.</p>
    <div class="filters" id="filters">
      <button class="f-story" data-k="story" aria-pressed="true">story</button>
      <button class="f-kill" data-k="kill" aria-pressed="true">first kills</button>
      <button class="f-clear" data-k="clear" aria-pressed="true">first clears</button>
      <button class="f-phase" data-k="phase" aria-pressed="true">phases</button>
    </div>
    <div class="feed" id="feed"><div class="loading">loading…</div></div>
  </div>
</main>
<script src="assets/shared.js"></script>
<script>
"use strict";
renderNav("milestones.html");
const show = { story: true, kill: true, clear: true, phase: true };
let EVENTS = [];

const fmtDur = (ms) => {
  const total = Math.round(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const parts = [];
  if (h) parts.push(h + (h === 1 ? " hour" : " hours"));
  if (m) parts.push(m + (m === 1 ? " minute" : " minutes"));
  if (!h && s) parts.push(s + (s === 1 ? " second" : " seconds"));
  return parts.join(" ") || "0 seconds";
};

function draw() {
  const feed = document.getElementById("feed");
  feed.innerHTML = EVENTS.filter((e) => show[e.kind]).map((e) =>
    `<div class="ev ${e.kind}">` +
    `<div class="when">${e.date}</div>` +
    `<h3>${e.link ? `<a href="${e.link}">${esc(e.title)}</a>` : (e.titleHtml ?? esc(e.title))}</h3>` +
    (e.blurbHtml ? `<p>${e.blurbHtml}</p>` : e.blurb ? `<p>${esc(e.blurb)}</p>` : "") +
    (e.html ? `<div class="long">${e.html}</div>` : "") +
    (e.videos?.length
      ? `<div class="vids">${e.videos.map((id) =>
          `<a href="https://www.youtube.com/watch?v=${id}" rel="noopener"><img loading="lazy" width="180" height="101" alt="YouTube video" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"></a>`).join("")}</div>`
      : "") +
    `</div>`).join("") || `<div class="empty">nothing selected</div>`;
}

document.getElementById("filters").addEventListener("click", (evt) => {
  const b = evt.target.closest("button[data-k]");
  if (!b) return;
  show[b.dataset.k] = !show[b.dataset.k];
  b.setAttribute("aria-pressed", String(show[b.dataset.k]));
  draw();
});

async function loadStory() {
  try {
    const r = await fetch("data/milestones.json");
    if (r.ok) return (await r.json()).milestones;
  } catch {}
  return MILESTONES.map(([date, title, blurb]) => ({ date, title, blurb }));
}

Promise.all([loadRaids(), loadStory()]).then(([raids, story]) => {
  const zoneName = new Map(raids.zones.map((z) => [z.zoneId, z.zoneName]));
  const events = [];
  for (const s of story) {
    events.push({ kind: "story", date: s.date, title: s.title, titleHtml: s.titleHtml, blurb: s.blurb, blurbHtml: s.blurbHtml, html: s.html, videos: s.videos });
  }
  for (const [date, tag, what] of PHASES) {
    events.push({ kind: "phase", date, title: tag === "TBC" ? "The Burning Crusade" : `Phase ${tag.slice(1)}`, blurb: what });
  }
  for (const f of raids.firstKills) {
    events.push({
      kind: "kill", date: f.date,
      title: `First kill: ${f.bossName}`,
      blurb: `${zoneName.get(f.zoneId) ?? ""} · ${fmtDur(f.durationMs)} · ${f.identity}`,
      link: `raid.html#${f.sessionId}`,
    });
  }
  const seenZone = new Set();
  for (const c of raids.fullClears.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    if (seenZone.has(c.zoneId)) continue;
    seenZone.add(c.zoneId);
    events.push({
      kind: "clear", date: c.date,
      title: `First full clear: ${zoneName.get(c.zoneId) ?? c.zoneId}`,
      blurb: `${c.bossesKilled} bosses in ${fmtDur(c.clearSpanMs)} · ${c.identity}`,
      link: `raid.html#${c.sessionId}`,
    });
  }
  EVENTS = events.sort((a, b) => a.date.localeCompare(b.date));
  draw();
});
</script>
</body>
</html>
